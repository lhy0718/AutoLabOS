name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate harness records
        run: npm run validate:harness

      - name: Validate research governance process E2E
        run: npm run validate:research-governance

      - name: Sync repo-local plugin cache
        run: npm run plugin:sync-cache -- --write

      - name: Check plugin release readiness
        run: npm run plugin:release-check

      - name: Test
        run: npm test
